name: launchrail

x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile

x-database-environment: &database-environment
  POSTGRES_DB: ${POSTGRES_DB:-launchrail}
  POSTGRES_USER: ${POSTGRES_USER:-launchrail}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-launchrail_local}

services:
  db:
    image: postgres:17.10-alpine3.23@sha256:8189a1f6e40904781fc9e2612687877791d21679866db58b1de996b31fc312e4
    environment: *database-environment
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    image: launchrail-backend:local
    build: *backend-build
    command: ["/app/migrate", "up"]
    environment:
      LAUNCHRAIL_DATABASE_URL: postgres://${POSTGRES_USER:-launchrail}:${POSTGRES_PASSWORD:-launchrail_local}@db:5432/${POSTGRES_DB:-launchrail}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: launchrail-backend:local
    build: *backend-build
    environment:
      LAUNCHRAIL_HTTP_ADDR: ":8080"
      LAUNCHRAIL_LOG_LEVEL: ${LAUNCHRAIL_LOG_LEVEL:-info}
      LAUNCHRAIL_SHUTDOWN_TIMEOUT: ${LAUNCHRAIL_SHUTDOWN_TIMEOUT:-10s}
      LAUNCHRAIL_DATABASE_URL: postgres://${POSTGRES_USER:-launchrail}:${POSTGRES_PASSWORD:-launchrail_local}@db:5432/${POSTGRES_DB:-launchrail}?sslmode=disable
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    image: launchrail-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1:8080/frontend-healthz",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  db-test:
    image: postgres:17.10-alpine3.23@sha256:8189a1f6e40904781fc9e2612687877791d21679866db58b1de996b31fc312e4
    profiles: ["test"]
    environment:
      POSTGRES_DB: launchrail_test
      POSTGRES_USER: launchrail_test
      POSTGRES_PASSWORD: launchrail_test
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launchrail_test -d launchrail_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  seed-e2e:
    image: postgres:17.10-alpine3.23@sha256:8189a1f6e40904781fc9e2612687877791d21679866db58b1de996b31fc312e4
    profiles: ["e2e"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-launchrail_local}
    command:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -h
      - db
      - -U
      - ${POSTGRES_USER:-launchrail}
      - -d
      - ${POSTGRES_DB:-launchrail}
      - -f
      - /seeds/e2e.sql
    volumes:
      - ./backend/seeds:/seeds:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  e2e:
    image: launchrail-e2e:local
    profiles: ["e2e"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e
    init: true
    ipc: host
    environment:
      CI: ${CI:-false}
      E2E_BASE_URL: http://frontend:8080
      E2E_API_URL: http://api:8080
    volumes:
      - ./frontend/playwright-report:/work/playwright-report
      - ./frontend/test-results:/work/test-results
    depends_on:
      frontend:
        condition: service_healthy
      seed-e2e:
        condition: service_completed_successfully
    restart: "no"

volumes:
  postgres_data:
